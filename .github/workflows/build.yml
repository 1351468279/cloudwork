name: Build & Release CloudWork

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-daemon:
    name: Build Multi-Platform Daemon Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd daemon
          BINARY_NAME="cloudwork-daemon-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          mkdir -p bin
          go build -ldflags="-s -w" -o "bin/${BINARY_NAME}" ./cmd/cloudwork-daemon

      - name: Upload Daemon Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: daemon/bin/*

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton & Build APK
        run: |
          cd app
          flutter create --project-name cloudwork_app --platforms=android,web .
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudwork-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  build-relay:
    name: Build Relay Server & Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Relay Binary
        run: |
          cd relay
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/cloudwork-relay ./cmd/cloudwork-relay

      - name: Docker Build Test
        run: |
          docker build -t cloudwork-relay:latest ./relay
