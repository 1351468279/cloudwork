<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudWork 掌上指挥官 (Zero-Config)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --primary: #58a6ff;
      --success: #238636;
      --danger: #da3633;
      --warning: #d29922;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .mobile-frame {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      height: 94vh;
    }
    .header {
      padding: 16px 20px;
      background: #1c2128;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(35, 134, 54, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-badge.offline {
      background: rgba(218, 54, 51, 0.2);
      color: #f85149;
      border-color: rgba(218, 54, 51, 0.4);
    }
    .tabs {
      display: flex;
      background: #161b22;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #1c2128;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .card-title {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    select, input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--primary);
    }
    textarea {
      resize: vertical;
      min-height: 85px;
      font-family: inherit;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #0d1117; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    
    /* 审批卡片 */
    .approval-card {
      border: 1px solid var(--warning);
      background: rgba(210, 153, 34, 0.12);
      border-radius: 14px;
      padding: 16px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(210, 153, 34, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(210, 153, 34, 0); }
      100% { box-shadow: 0 0 0 0 rgba(210, 153, 34, 0); }
    }
    .approval-header {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--warning);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .approval-command {
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #7ee787;
      word-break: break-all;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .approval-actions {
      display: flex;
      gap: 10px;
    }
    .approval-actions .btn { flex: 1; padding: 10px; font-size: 0.85rem; }

    /* 终端日志 */
    .terminal-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.4;
      height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #8b949e;
    }
    .workspace-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .workspace-item:hover {
      border-color: var(--primary);
    }
    .workspace-name { font-weight: 600; font-size: 0.9rem; color: #fff; }
    .workspace-path { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); }
    .quick-chip {
      display: inline-block;
      padding: 4px 8px;
      background: #21262d;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-right: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .quick-chip:hover {
      background: #30363d;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="header">
      <h1>⚡ CloudWork 指挥官</h1>
      <span id="connStatus" class="status-badge offline">未连接</span>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('tab-control')">🎮 遥控指挥</div>
      <div class="tab" onclick="switchTab('tab-workspaces')">📁 项目目录</div>
      <div class="tab" onclick="switchTab('tab-logs')">📜 终端日志</div>
    </div>

    <!-- 1. 遥控指挥主页 -->
    <div id="tab-control" class="content-area">
      <!-- 动态审批卡片区 -->
      <div id="approvalArea" style="display: none;"></div>

      <!-- 下发任务面板 -->
      <div class="card">
        <div class="card-title">🚀 派发任务给本地 Agent</div>
        
        <div class="form-group">
          <label>目标 Agent（自动继承电脑配置）</label>
          <select id="agentSelect">
            <option value="codex">OpenAI Codex CLI (codex)</option>
            <option value="claude">Anthropic Claude Code (claude)</option>
            <option value="aider">Aider (aider)</option>
            <option value="generic">通用 CLI 工具 (cmd/bash)</option>
          </select>
        </div>

        <div class="form-group">
          <label>当前工作目录</label>
          <input type="text" id="workingDirInput" value="." placeholder="留空使用当前目录">
        </div>

        <div class="form-group">
          <label>常用 Prompt 快捷预设</label>
          <div>
            <span class="quick-chip" onclick="setPrompt('检查项目语法错误并运行测试')">🧪 运行测试</span>
            <span class="quick-chip" onclick="setPrompt('给当前项目编写详细的 README 说明')">📝 编写文档</span>
            <span class="quick-chip" onclick="setPrompt('审查当前 Git 修改并生成 Commit')">🔍 审查代码</span>
            <span class="quick-chip" onclick="setPrompt('清理冗余日志和无用代码')">🧹 代码精简</span>
          </div>
        </div>

        <div class="form-group">
          <label>任务指令 (Prompt)</label>
          <textarea id="promptInput" placeholder="输入要交给 AI Agent 自动执行的编程指令..."></textarea>
        </div>

        <button class="btn btn-primary" onclick="startSession()">🚀 派发至电脑执行</button>
      </div>

      <!-- 活动会话看板 -->
      <div class="card">
        <div class="card-title">
          <span>📡 电脑端会话状态</span>
          <span id="sessionStatusTag" style="font-size: 0.75rem; color: var(--text-muted);">空闲</span>
        </div>
        <div id="sessionsList" style="font-size: 0.85rem; color: var(--text-muted);">暂无活动任务</div>
      </div>
    </div>

    <!-- 2. 项目工作区页 -->
    <div id="tab-workspaces" class="content-area" style="display: none;">
      <div class="card">
        <div class="card-title">📁 电脑常用项目与 Git 仓库</div>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">点击即可快速将该项目设为当前工作目录：</p>
        <div id="workspacesList">
          <div class="workspace-item" onclick="selectDir('E:\\privateproject\\cloudwork')">
            <div>
              <div class="workspace-name">cloudwork</div>
              <div class="workspace-path">E:\privateproject\cloudwork</div>
            </div>
            <div style="font-size: 0.75rem; color: var(--primary);">选择 ➔</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 终端日志页 -->
    <div id="tab-logs" class="content-area" style="display: none;">
      <div class="card">
        <div class="card-title">🖥️ 实时终端标准输出流</div>
        <div id="terminalLog" class="terminal-box">等待任务输出...</div>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let activeSessionId = null;

    function connectWS() {
      const port = 9288;
      ws = new WebSocket(`ws://127.0.0.1:${port}/ws`);

      ws.onopen = () => {
        document.getElementById('connStatus').className = 'status-badge';
        document.getElementById('connStatus').innerText = '已连接电脑';
        ws.send(JSON.stringify({ action: 'get_status' }));
      };

      ws.onclose = () => {
        document.getElementById('connStatus').className = 'status-badge offline';
        document.getElementById('connStatus').innerText = '连接断开，重连中...';
        setTimeout(connectWS, 2000);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleServerMessage(msg);
      };
    }

    function handleServerMessage(msg) {
      if (msg.type === 'status' && msg.action === 'get_status') {
        renderStatus(msg.data);
      } else if (msg.type === 'event') {
        const ev = msg.data;
        appendLog(`[${ev.agent_type}] [${ev.status}] ${ev.message || ''}\n${ev.raw_output || ''}`);
        
        document.getElementById('sessionStatusTag').innerText = ev.status;
        
        if (ev.type === 'tool_call_request') {
          activeSessionId = ev.session_id;
          showApprovalCard(ev);
        } else if (ev.type === 'session_finished') {
          hideApprovalCard();
        }
      } else if (msg.type === 'response' && msg.action === 'start_session') {
        if (msg.success) {
          activeSessionId = msg.data.id;
          appendLog(`\n>>> 任务已在电脑端拉起! SessionID: ${activeSessionId}\n`);
        } else {
          alert('启动失败: ' + msg.error);
        }
      }
    }

    function renderStatus(data) {
      if (data.working_dir) {
        document.getElementById('workingDirInput').value = data.working_dir;
      }
    }

    function setPrompt(text) {
      document.getElementById('promptInput').value = text;
    }

    function selectDir(path) {
      document.getElementById('workingDirInput').value = path;
      switchTab('tab-control');
    }

    function showApprovalCard(ev) {
      const area = document.getElementById('approvalArea');
      area.style.display = 'block';
      const tc = ev.tool_call || {};
      area.innerHTML = `
        <div class="approval-card">
          <div class="approval-header">⚠️ 等待手机端授权执行命令</div>
          <div style="font-size: 0.8rem; margin-bottom: 6px; color: var(--text-muted);">${ev.message}</div>
          <div class="approval-command">${tc.command || tc.description || '执行命令'}</div>
          <div class="approval-actions">
            <button class="btn btn-success" onclick="sendApproval(true)">✅ 允许执行</button>
            <button class="btn btn-danger" onclick="sendApproval(false)">❌ 拒绝执行</button>
          </div>
        </div>
      `;
    }

    function hideApprovalCard() {
      const area = document.getElementById('approvalArea');
      area.style.display = 'none';
    }

    function sendApproval(isAllow) {
      if (!ws || !activeSessionId) return;
      ws.send(JSON.stringify({
        action: isAllow ? 'approve' : 'reject',
        session_id: activeSessionId
      }));
      hideApprovalCard();
      appendLog(isAllow ? '>>> 手机端已批准执行命令\n' : '>>> 手机端已拒绝执行命令\n');
    }

    function startSession() {
      const agentType = document.getElementById('agentSelect').value;
      const workingDir = document.getElementById('workingDirInput').value.trim();
      const prompt = document.getElementById('promptInput').value.trim();

      if (!prompt) {
        alert('请输入任务需求');
        return;
      }

      ws.send(JSON.stringify({
        action: 'start_session',
        payload: {
          agent_type: agentType,
          working_dir: workingDir,
          prompt: prompt
        }
      }));

      document.getElementById('promptInput').value = '';
    }

    function appendLog(text) {
      const box = document.getElementById('terminalLog');
      box.innerText += '\n' + text;
      box.scrollTop = box.scrollHeight;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content-area').forEach(c => c.style.display = 'none');
      const clickedTab = Array.from(document.querySelectorAll('.tab')).find(t => t.getAttribute('onclick').includes(tabId));
      if (clickedTab) clickedTab.classList.add('active');
      document.getElementById(tabId).style.display = 'flex';
    }

    window.onload = connectWS;
  </script>
</body>
</html>
