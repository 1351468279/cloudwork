# Fly.io configuration for CloudWork E2EE Relay
app = "cloudwork-relay"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9289"

[http_service]
  internal_port = 9289
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
